services:
  postgres-election:
    image: postgres:16-alpine
    container_name: postgres-election
    environment:
      POSTGRES_DB: election_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-election-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d election_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - election-net

  postgres-voter:
    image: postgres:16-alpine
    container_name: postgres-voter
    environment:
      POSTGRES_DB: voter_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-voter-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voter_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - election-net

  postgres-vote:
    image: postgres:16-alpine
    container_name: postgres-vote
    environment:
      POSTGRES_DB: vote_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres-vote-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vote_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - election-net

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    networks:
      - election-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_READONLY: "false"
    networks:
      - election-net

  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - election-net

  election-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: election-service
    container_name: election-service
    depends_on:
      discovery-service:
        condition: service_started
      postgres-election:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-election:5432/election_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      EUREKA_URL: http://discovery-service:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8081:8081"
    networks:
      - election-net

  voter-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: voter-service
    container_name: voter-service
    depends_on:
      discovery-service:
        condition: service_started
      postgres-voter:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-voter:5432/voter_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      EUREKA_URL: http://discovery-service:8761/eureka
    ports:
      - "8082:8082"
    networks:
      - election-net

  vote-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: vote-service
    container_name: vote-service
    depends_on:
      discovery-service:
        condition: service_started
      postgres-vote:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-vote:5432/vote_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      EUREKA_URL: http://discovery-service:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8083:8083"
    networks:
      - election-net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    depends_on:
      discovery-service:
        condition: service_started
      election-service:
        condition: service_started
      voter-service:
        condition: service_started
      vote-service:
        condition: service_started
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
    ports:
      - "8080:8080"
    networks:
      - election-net

volumes:
  postgres-election-data:
  postgres-voter-data:
  postgres-vote-data:

networks:
  election-net:
    driver: bridge
