server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: election-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/election_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: ru.tkhapchaev.electionservice.kafka.VoteCreatedEvent

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

springdoc:
  swagger-ui:
    path: /swagger

app:
  kafka:
    vote-created-topic: vote-created

management:
  endpoints:
    web:
      exposure:
        include: health,info
